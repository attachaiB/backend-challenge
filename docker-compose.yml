services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: user_management
      # Development secret only. Use a long random value in production.
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-32}
      JWT_DURATION: 24h
      USER_COUNT_INTERVAL: 10s
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
